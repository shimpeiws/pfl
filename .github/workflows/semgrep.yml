name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `--config=auto` pulls the registry rule set for the languages present.
      # `--error` fails the job on a finding, so a PR cannot merge past one.
      - name: Scan
        run: semgrep scan --config=auto --error --json --output=semgrep.json

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep
          path: semgrep.json
          if-no-files-found: ignore
