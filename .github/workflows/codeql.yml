name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, independent of PR traffic.
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: javascript-typescript
          # security-extended adds queries beyond the default set; this is the
          # "yuurei level" scan the roadmap's §3.3 asks for.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          category: '/language:javascript-typescript'
