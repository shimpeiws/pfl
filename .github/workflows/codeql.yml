name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, independent of PR traffic (roadmap §3.3).
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          # security-extended adds queries beyond the default set; this is the
          # "yuurei level" scan the roadmap's §3.3 asks for.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:javascript-typescript'
