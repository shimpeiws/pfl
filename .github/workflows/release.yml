name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) needs npm >= 11.5.1 and a recent CLI.
      - run: npm install -g npm@latest

      - run: pnpm run check
      - run: pnpm run format
      - run: pnpm run build
      - run: pnpm run typecheck:test
      - run: pnpm test
      - run: pnpm run knip

      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Inspect the tarball contents
        run: npm pack --dry-run

      - name: Smoke-test the packed tarball
        run: |
          npm pack
          tarball="$(ls ./*.tgz)"
          smoke="$(mktemp -d)"
          cd "$smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$tarball" >/dev/null
          ./node_modules/.bin/pfl --help >/dev/null
          ./node_modules/.bin/pfl --version

      # Trusted publishing (npm OIDC): no token. Provenance is requested
      # explicitly, since it is not always attached automatically.
      # Requires the trusted publisher configured on npmjs.com (see the README).
      - name: Publish
        run: npm publish --provenance --access public
