name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Assert the runner's npm
      # instead of pinning or force-upgrading it: a stale runner then fails here
      # with a clear message rather than deep in the publish step, and the
      # workflow keeps using the npm the runner ships.
      - name: Assert the runner npm supports trusted publishing
        run: |
          required="11.5.1"
          have="$(npm --version)"
          node -e '
            const parse = (value) => value.split("-")[0].split(".").map(Number);
            const compare = (a, b) => (a[0] - b[0]) || (a[1] - b[1]) || (a[2] - b[2]);
            if (compare(parse(process.argv[1]), parse(process.argv[2])) < 0) {
              console.error(
                `::error::npm ${process.argv[1]} is older than ${process.argv[2]}, which trusted publishing (OIDC) requires.`,
              );
              process.exit(1);
            }
          ' "$have" "$required"
          echo "npm $have supports trusted publishing"

      - run: pnpm run check
      - run: pnpm run format
      - run: pnpm run build
      - run: pnpm run typecheck:test
      - run: pnpm test
      - run: pnpm run knip

      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Inspect the tarball contents
        run: npm pack --dry-run

      - name: Smoke-test the packed tarball
        run: |
          npm pack
          tarball="$(ls ./*.tgz)"
          # The build no longer emits source maps (see tsconfig.json); assert it,
          # so the decision is enforced rather than documented.
          if tar -tzf "$tarball" | grep -q '\.map$'; then
            echo "::error::the tarball ships a source map; see the tsconfig.json comment" >&2
            tar -tzf "$tarball" | grep '\.map$' >&2
            exit 1
          fi
          smoke="$(mktemp -d)"
          cd "$smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$tarball" >/dev/null
          ./node_modules/.bin/pfl --help >/dev/null
          ./node_modules/.bin/pfl --version

      # A prerelease tag (any tag whose version contains `-`, e.g.
      # `v1.0.0-rc.1`) exercises the whole workflow without publishing: the gate,
      # tag/version agreement, tarball inspection, and smoke test all run, and
      # only the publish becomes a dry run. This is the first of the two stages
      # the v1.0 release plan requires. The dry run does not perform the OIDC
      # token exchange, so provenance attachment is confirmed only on the real
      # publish.
      - name: Publish (dry run for a prerelease tag)
        if: contains(github.ref_name, '-')
        run: npm publish --dry-run --access public

      # Trusted publishing (npm OIDC): no token. Provenance is requested
      # explicitly, since it is not always attached automatically.
      # Requires the trusted publisher configured on npmjs.com (see the README).
      - name: Publish
        if: ${{ !contains(github.ref_name, '-') }}
        run: npm publish --provenance --access public
