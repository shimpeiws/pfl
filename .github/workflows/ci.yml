name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The `ci` job keeps the Ubuntu matrix and its check names (`ci (22)`,
  # `ci (24)`) stable, because the `main` ruleset requires exactly those
  # contexts. Adding an `os` dimension to this matrix would rename every check
  # and leave the required gate unsatisfiable, so macOS runs as its own job
  # below instead.
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pinned pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check
      - run: pnpm run format
      - run: pnpm run build
      - run: pnpm run typecheck:test
      - run: pnpm test
      - run: pnpm run knip

  # macOS is required: the managed-scope discovery is macOS-specific, and the
  # case-insensitivity behaviour of `isPathWithin` is only exercised on a
  # case-insensitive volume. Its checks are not yet required by the ruleset.
  ci-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check
      - run: pnpm run format
      - run: pnpm run build
      - run: pnpm run typecheck:test
      - run: pnpm test
      - run: pnpm run knip

  coverage:
    # Measurement is a separate job so it runs once, not per matrix cell. The
    # summary prints in the job log and is gated by the thresholds in
    # vitest.config.ts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
      - run: pnpm run test:coverage
