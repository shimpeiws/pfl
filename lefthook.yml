pre-commit:
  parallel: true
  commands:
    check:
      glob: '*.{ts,js}'
      run: pnpm run check:fix && git add -u
    format:
      glob: '*.{ts,js,json,yml,yaml,md}'
      run: pnpm run format:fix && git add -u
    knip:
      run: pnpm run knip
    test:
      run: pnpm test

pre-push:
  parallel: false
  commands:
    build:
      run: pnpm run build
    typecheck-test:
      run: pnpm run typecheck:test
